<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIDM - Discovery Agent</title>
<style>
  :root {
    --bg:#f5f6f8; --surface:#fff; --ink:#0f1b2d; --muted:#5b687a; --line:#dde2ea; --accent:#2a56e0; --accent-ink:#fff;
    --soft:#eaeffd; --ok:#17835c; --err:#b3322f; --flash:#fff4c2; --head:#0e1b2e; color-scheme:light;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
    --pad:clamp(12px,3vw,24px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0a111b; --surface:#111b29; --ink:#e7edf6; --muted:#93a1b5; --line:#233145; --accent:#7391ff; --accent-ink:#0a1020;
      --soft:#1a2747; --ok:#4cc29a; --err:#ff9a98; --flash:#3a3414; --head:#070d16; color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  html { height:100%; -webkit-text-size-adjust:100%; }
  body { margin:0; height:100%; height:100dvh; display:flex; flex-direction:column; background:var(--bg); color:var(--ink);
    font:15px/1.6 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; overflow-x:hidden; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:8px 14px; touch-action:manipulation; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }

  .top { background:var(--head); color:#fff; min-height:56px; padding:var(--sat) calc(var(--pad) + var(--sar)) 0 calc(var(--pad) + var(--sal));
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex:none; }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .mark { width:28px; height:28px; border-radius:7px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:800; font-size:.9rem; }
  .brand b { font-size:1.05rem; letter-spacing:-.01em; }
  .brand i { width:1px; height:18px; background:rgba(255,255,255,.25); flex:none; }
  .brand span { color:#b9c5d8; font-size:.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .top .right { display:flex; align-items:center; gap:10px; flex:none; }
  .brand { flex:0 1 auto; }
  .chip { font-size:.8rem; color:#c8d2e3; border:1px solid rgba(255,255,255,.25); border-radius:99px; padding:2px 10px; white-space:nowrap; }
  .top button { background:transparent; color:#fff; border-color:rgba(255,255,255,.3); white-space:nowrap; }
  .top button:hover:not(:disabled) { border-color:#fff; }
  #ficha { display:none; }

  .wrap { flex:1; min-height:0; width:100%; max-width:1240px; margin:0 auto; padding:var(--pad) calc(var(--pad) + var(--sar)) calc(var(--pad) + var(--sab)) calc(var(--pad) + var(--sal)); display:flex; }
  .grid { flex:1; min-height:0; min-width:0; display:grid; grid-template-columns:minmax(0,1fr) clamp(280px,28vw,340px); gap:20px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:10px; }
  .chat { display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden; position:relative; }
  #chat { flex:1; overflow-y:auto; overscroll-behavior:contain; padding:clamp(16px,4vw,28px) clamp(14px,4vw,28px) 12px; scroll-behavior:smooth; }
  .msg { max-width:680px; margin:0 auto 22px; }
  .msg .who { font-size:.82rem; font-weight:700; color:var(--accent); margin-bottom:2px; }
  .msg .txt { white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.user .who { color:var(--muted); }
  .msg.user .txt { background:var(--soft); border-radius:8px; padding:10px 14px; }
  .msg.error .who, .msg.error .txt { color:var(--err); }
  .msg.error .txt { border-left:3px solid var(--err); padding-left:12px; }
  .busy { height:3px; background:transparent; overflow:hidden; }
  .busy.on { background:var(--line); }
  .busy.on::after { content:""; display:block; width:30%; height:100%; background:var(--accent); animation:slide 1.3s ease-in-out infinite; }
  .busy.on.det::after { animation:none; margin-left:0; width:var(--p,0%); transition:width .4s; }
  .msg.aviso .who { color:var(--muted); }
  .msg.aviso .txt { border-left:3px solid var(--accent); padding-left:12px; color:var(--muted); }
  @keyframes slide { from { margin-left:-30%; } to { margin-left:100%; } }
  .stat { min-height:26px; padding:4px clamp(14px,4vw,28px) 0; max-width:736px; width:100%; margin:0 auto; color:var(--muted); font-size:.85rem; font-variant-numeric:tabular-nums; }
  form { padding:6px clamp(14px,4vw,28px) clamp(12px,3vw,18px); max-width:736px; width:100%; margin:0 auto; }
  .box { display:flex; align-items:flex-end; gap:10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); padding:8px 8px 8px 14px; }
  .box:focus-within { border-color:var(--accent); }
  textarea:focus-visible { outline:0; }
  textarea { flex:1; min-width:0; resize:none; max-height:140px; font:inherit; color:var(--ink); background:transparent; border:0; outline:0; padding:6px 0; }
  .hint { margin:6px 2px 0; font-size:.78rem; color:var(--muted); }

  .side { display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .sh { padding:16px 18px 12px; border-bottom:1px solid var(--line); }
  .sh > div:first-child { display:flex; justify-content:space-between; align-items:baseline; font-weight:700; gap:10px; }
  .sh span { font-weight:600; color:var(--muted); font-size:.85rem; font-variant-numeric:tabular-nums; }
  .sh .close { display:none; }
  .track { height:5px; border-radius:99px; background:var(--line); margin-top:10px; overflow:hidden; }
  .track i { display:block; height:100%; width:0; background:var(--ok); transition:width .4s; }
  #fields { flex:1; overflow-y:auto; overscroll-behavior:contain; padding:6px 18px 16px; }
  .g h3 { display:flex; justify-content:space-between; margin:16px 0 4px; font-size:.82rem; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; }
  .f { display:grid; grid-template-columns:10px 1fr; gap:0 10px; padding:7px 0; border-top:1px solid var(--line); }
  .dot { width:9px; height:9px; margin-top:7px; border-radius:50%; border:2px solid var(--line); }
  .f.on .dot { background:var(--ok); border-color:var(--ok); }
  .k { font-size:.78rem; color:var(--muted); }
  .v { font-size:.88rem; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .f.off .v { color:var(--muted); }
  .f.flash { animation:flash 1.6s; }
  @keyframes flash { from { background:var(--flash); } to { background:transparent; } }

  #scrim { display:none; }

  #done { display:none; flex:1; min-height:0; min-width:0; flex-direction:column; gap:14px; }
  body.done #done { display:flex; } body.done .grid { display:none; } body.done #ficha { display:none !important; }
  .okbar { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:14px 20px; }
  .acciones { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
  .okbar h2 { margin:0; font-size:1.05rem; } .okbar p { margin:0; color:var(--muted); font-size:.88rem; }
  iframe { flex:1; width:100%; min-height:0; border:1px solid var(--line); border-radius:10px; background:#fff; }

  /* ---------- Responsive ---------- */
  @media (max-width:1100px) { .grid { gap:14px; } }

  /* Tablet y móvil: la ficha pasa a ser un panel inferior desplegable */
  @media (max-width:900px) {
    .grid { grid-template-columns:minmax(0,1fr); }
    .brand span, .brand i { display:none; }
    #ficha { display:inline-flex; align-items:center; gap:6px; min-height:36px; font-variant-numeric:tabular-nums; }
    .side { position:fixed; left:0; right:0; bottom:0; z-index:30; height:78vh; height:78dvh; max-height:calc(100dvh - 48px);
      border-radius:16px 16px 0 0; border-bottom:0; padding-bottom:var(--sab);
      transform:translateY(105%); visibility:hidden; transition:transform .3s ease, visibility 0s linear .3s; box-shadow:0 -10px 40px rgba(0,0,0,.25); }
    body.sheet .side { transform:none; visibility:visible; transition:transform .3s ease; }
    .sh .close { display:inline-block; padding:4px 10px; font-size:.82rem; }
    #scrim { display:block; position:fixed; inset:0; z-index:20; background:rgba(5,10,20,.5); opacity:0; pointer-events:none; transition:opacity .3s; }
    body.sheet #scrim { opacity:1; pointer-events:auto; }
    body.sheet { overflow:hidden; }
    .okbar { padding:12px 16px; }
  }

  @media (max-width:600px) {
    body { font-size:15px; }
    .chip.poc { display:none; }
    .chip#conn .ctx { display:none; }
    .chip#conn .led { margin-right:0; }
    .brand { flex:0 0 auto; }
    .top .right { gap:8px; }
    .top button { padding:6px 10px; font-size:.88rem; }
    .msg { margin-bottom:18px; }
    .hero { margin-top:2vh; }
    .hero h1 { font-size:1.3rem; }
    .hero p { font-size:.92rem; }
    .hint { display:none; }
    .box { padding:6px 6px 6px 12px; }
    #send { min-height:40px; }
    .okbar { flex-direction:column; align-items:stretch; text-align:left; }
    .acciones { flex-direction:column; justify-content:stretch; }
    .okbar button { width:100%; min-height:44px; }
    .wrap { padding-left:calc(8px + var(--sal)); padding-right:calc(8px + var(--sar)); padding-top:8px; }
    #done { gap:8px; }
  }
  @media (max-width:380px) {
    .chip#conn { font-size:.72rem; padding:2px 7px; }
    .brand b { font-size:.98rem; }
  }
  /* Móvil apaisado: poco alto disponible */
  @media (max-height:480px) and (orientation:landscape) {
    .top { min-height:44px; }
    .hero { margin-top:0; }
    .hero .orb { --s:36px !important; }
    .hint, .stat { display:none; }
    .side { height:calc(100dvh - 12px); max-height:none; }
  }
  /* Pantallas táctiles: objetivos de toque y sin zoom automático al enfocar */
  @media (pointer:coarse) {
    button { min-height:40px; }
    textarea { font-size:16px; }
    .meta button { min-height:32px; padding:0 8px; }
  }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }

  .orb { position:relative; width:var(--s,28px); height:var(--s,28px); border-radius:50%; flex:none; background:conic-gradient(#2a56e0,#7a5cff,#14b8a6,#2a56e0); animation:spin 7s linear infinite; }
  .orb::after { content:""; position:absolute; inset:24%; border-radius:50%; background:var(--head); }
  .orb.think { animation-duration:1.3s; }
  .msg .orb::after, .hero .orb::after { background:var(--surface); }
  @keyframes spin { to { transform:rotate(360deg); } }
  .msg .who { display:flex; align-items:center; gap:7px; }
  .meta { display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-top:4px; font-size:.76rem; color:var(--muted); }
  .meta button { padding:0 4px; border:0; background:none; font-size:.76rem; color:var(--accent); }
  .hero { max-width:560px; margin:5vh auto 0; text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .hero h1 { margin:10px 0 0; font-size:1.55rem; letter-spacing:-.02em; }
  .hero p { margin:0; color:var(--muted); }
  .chips { display:flex; flex-direction:column; gap:8px; width:100%; margin-top:12px; }
  .chips button { text-align:left; padding:10px 14px; }
  .led { display:inline-block; width:7px; height:7px; margin-right:7px; border-radius:50%; background:#8a97a8; }
  .led.ok { background:#37c28d; } .led.bad { background:#ff7b7b; }
  .ev { margin:4px 0; padding:5px 0 5px 12px; border-left:2px solid var(--line); font-size:.82rem; color:var(--muted); overflow-wrap:anywhere; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="orb" style="--s:26px"></div><b>AIDM</b><i></i><span>Discovery Agent para proyectos Data y AI</span></div>
  <div class="right">
    <span class="chip" id="conn"><i class="led"></i><span class="ctx">Conectando</span></span>
    <span class="chip poc">Primera PoC</span>
    <button id="ficha" type="button" aria-controls="side" aria-expanded="false">Ficha <span id="fichaCount">0/20</span></button>
    <button id="reset" type="button">Nueva sesión</button>
  </div>
</header>

<div class="wrap">
  <main class="grid">
    <section class="card chat">
      <div id="chat" aria-live="polite"></div>
      <div class="busy" id="busy"></div>
      <div class="stat" id="stat"></div>
      <form id="form">
        <div class="box">
          <textarea id="input" rows="1" placeholder="Describe tu proyecto de Data y AI" aria-label="Mensaje"></textarea>
          <button id="send" class="primary" type="submit">Enviar</button>
        </div>
        <p class="hint">Intro para enviar. Mayús + Intro para un salto de línea.</p>
      </form>
    </section>
    <aside class="card side" id="side">
      <div class="sh"><div>Ficha del proyecto <span id="count">0/20</span><button id="closeSheet" class="close" type="button">Cerrar</button></div><div class="track"><i id="barfill"></i></div></div>
      <div id="fields"></div>
    </aside>
  </main>
  <div id="scrim"></div>

  <section id="done">
    <div class="card okbar">
      <div><h2 id="doneTitle">Propuesta de solución</h2><p>Discovery completado. Descarga el informe o revísalo aquí.</p></div>
      <div class="acciones"><button id="abrir" type="button">Abrir en pestaña nueva</button><button id="download" class="primary" type="button">Descargar informe (HTML)</button></div>
    </div>
    <iframe id="report" sandbox="allow-scripts allow-same-origin" title="Informe de la propuesta"></iframe>
  </section>
</div>

<script>
const INTRO = "Describe la estructura y los requisitos de tu proyecto de Data y AI.";
const GROUPS = [
  ["Cliente", { nombre_del_cliente:"Cliente", "tamaño_empresa":"Tamaño de la empresa", sector:"Sector", tiene_equipo_datos:"Equipo de datos" }],
  ["Proyecto", { tipo_de_servicio:"Servicio solicitado", objetivo_del_proyecto:"Objetivo", enfoque_ai:"Enfoque de IA", kpis_de_exito:"KPIs de éxito", plazo_objetivo:"Plazo", restriccion_presupuestaria:"Presupuesto" }],
  ["Plataforma", { modelo_de_despliegue:"Despliegue", cloud_provider:"Proveedor cloud", tipo_de_arquitectura:"Arquitectura", herramienta_de_visualizacion:"Visualización", integration_scope:"Integración de datos", volumen_de_datos:"Volumen de datos" }],
  ["Situación actual", { madurez_analitica_actual:"Madurez analítica", tamano_equipo_tecnico:"Equipo técnico", stack_tecnologico_actual:"Stack actual", regulacion_y_compliance:"Compliance" }]
];
const $ = (id) => document.getElementById(id);
const TOTAL_PASOS = 13;
let messages, busy = false, timer = null, prev = {}, report = { html:"", name:"informe_aidm.html" };
let avisoVisto = 0, progTxt = "";

const SUGGEST = [
  "Queremos predecir la demanda y optimizar las rutas de reparto de nuestra logística",
  "Tenemos los datos dispersos en varios sistemas y queremos unificarlos en la nube",
  "Queremos incorporar IA generativa para automatizar la atención al cliente"
];

function setSheet(open) {
  document.body.classList.toggle("sheet", open);
  $("ficha").setAttribute("aria-expanded", String(open));
}

function showHero() {
  const h = document.createElement("div"); h.id = "hero"; h.className = "hero";
  const o = document.createElement("div"); o.className = "orb"; o.style.setProperty("--s", "60px");
  const t = document.createElement("h1"); t.textContent = "Cuéntame tu proyecto de Data y AI";
  const p = document.createElement("p"); p.textContent = "Te haré las preguntas necesarias para entender el caso y preparar una propuesta de solución a medida.";
  const c = document.createElement("div"); c.className = "chips";
  SUGGEST.forEach((s) => { const b = document.createElement("button"); b.type = "button"; b.textContent = s; b.onclick = () => { $("input").value = s; $("input").focus(); }; c.appendChild(b); });
  h.append(o, t, p, c); $("chat").appendChild(h);
}

function addMsg(role, text, secs) {
  const hero = $("hero"); if (hero) hero.remove();
  const m = document.createElement("div"); m.className = "msg " + role;
  const w = document.createElement("div"); w.className = "who";
  if (role === "assistant") { const o = document.createElement("span"); o.className = "orb"; o.style.setProperty("--s", "16px"); w.appendChild(o); }
  w.append(role === "user" ? "Tú" : role === "error" ? "Error" : role === "aviso" ? "Aviso" : "AIDM");
  const t = document.createElement("div"); t.className = "txt";   // textContent: el texto del modelo nunca se interpreta como HTML
  m.append(w, t); $("chat").appendChild(m);
  const hora = new Date().toLocaleTimeString("es-ES", { hour:"2-digit", minute:"2-digit" });
  const fin = () => {
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = hora + (secs > 0 ? ", respondido en " + secs + " s" : "");
    if (role === "assistant") {
      const b = document.createElement("button"); b.type = "button"; b.textContent = "Copiar";
      b.onclick = () => { navigator.clipboard.writeText(text); b.textContent = "Copiado"; setTimeout(() => { b.textContent = "Copiar"; }, 1500); };
      meta.appendChild(b);
    }
    if (role === "assistant" || role === "aviso") pintarMd(t, text);
    m.appendChild(meta); $("chat").scrollTop = $("chat").scrollHeight;
  };
  const directo = matchMedia("(prefers-reduced-motion: reduce)").matches || role !== "assistant" || text.length > 600;
  if (directo) { t.textContent = text; fin(); return; }
  let i = 0; const paso = Math.max(1, Math.ceil(text.length / 70));
  const id = setInterval(() => {
    i += paso; t.textContent = text.slice(0, i); $("chat").scrollTop = $("chat").scrollHeight;
    if (i >= text.length) { clearInterval(id); fin(); }
  }, 18);
}

// Markdown mínimo y seguro (negrita y viñetas) sin innerHTML: el texto nunca se interpreta como HTML.
function pintarMd(el, text) {
  el.replaceChildren();
  const lineas = text.split("\n");
  lineas.forEach((linea, i) => {
    const m = linea.match(/^\s*[-*]\s+(.*)$/);
    if (m) el.append("• ");
    (m ? m[1] : linea).split(/(\*\*[^*]+\*\*)/).forEach((p) => {
      if (/^\*\*[^*]+\*\*$/.test(p)) { const b = document.createElement("strong"); b.textContent = p.slice(2, -2); el.append(b); }
      else if (p) el.append(p);
    });
    if (i < lineas.length - 1) el.append("\n");
  });
}

function valueText(v) { return Array.isArray(v) ? v.join("; ") : String(v == null ? "" : v).trim(); }

function renderCaso(c) {
  const root = $("fields"); root.replaceChildren();
  let filled = 0, total = 0;
  GROUPS.forEach(([title, fields]) => {
    const g = document.createElement("div"); g.className = "g";
    const h = document.createElement("h3"); const hs = document.createElement("span"); hs.textContent = title; const hc = document.createElement("span");
    h.append(hs, hc); g.appendChild(h);
    let gf = 0;
    Object.entries(fields).forEach(([k, label]) => {
      const v = valueText((c[k] || {}).value); total++;
      if (v) { filled++; gf++; }
      const f = document.createElement("div"); f.className = "f " + (v ? "on" : "off");
      if (v && k in prev && prev[k] !== v) f.classList.add("flash");
      prev[k] = v;
      const dot = document.createElement("span"); dot.className = "dot";
      const box = document.createElement("div");
      const kk = document.createElement("div"); kk.className = "k"; kk.textContent = label;
      const vv = document.createElement("div"); vv.className = "v"; vv.textContent = v || "Pendiente"; vv.title = v;
      box.append(kk, vv); f.append(dot, box); g.appendChild(f);
    });
    hc.textContent = gf + "/" + Object.keys(fields).length;
    root.appendChild(g);
  });
  const ev = Array.isArray((c.evidencias || {}).value) ? c.evidencias.value : [];
  if (ev.length) {
    const g = document.createElement("div"); g.className = "g";
    const h = document.createElement("h3"); const a = document.createElement("span"); a.textContent = "Evidencias detectadas";
    const b = document.createElement("span"); b.textContent = String(ev.length); h.append(a, b); g.appendChild(h);
    ev.slice(-6).forEach((e) => { const p = document.createElement("div"); p.className = "ev"; p.textContent = e; g.appendChild(p); });
    root.appendChild(g);
  }
  $("count").textContent = filled + "/" + total;
  $("fichaCount").textContent = filled + "/" + total;
  $("barfill").style.width = (100 * filled / total) + "%";
}

function setConn(ok) {
  const c = $("conn"); c.replaceChildren();
  const l = document.createElement("i"); l.className = "led " + (ok ? "ok" : "bad");
  const tx = document.createElement("span"); tx.className = "ctx"; tx.textContent = ok ? "Agente listo" : "Sin conexión con el servidor";
  c.title = tx.textContent; c.append(l, tx);
}
async function refreshCaso() {
  try { const r = await fetch("/api/caso"); setConn(r.ok); if (r.ok) renderCaso(await r.json()); } catch (e) { setConn(false); }
}

async function refreshEstado(silencioso) {
  try {
    const r = await fetch("/api/estado"); if (!r.ok) return null;
    const e = await r.json();
    (e.avisos || []).forEach((a) => {
      if (a.id > avisoVisto) { avisoVisto = a.id; if (!silencioso) addMsg("aviso", a.texto); }   // el aviso no entra en messages: los agentes no lo leen
    });
    if (busy) {
      const f = Math.max(0, Math.min(1, Number(e.fraccion) || 0));
      const b = $("busy"); b.classList.toggle("det", f > 0); b.style.setProperty("--p", (f * 100) + "%");
      progTxt = f > 0 ? Math.round(f * TOTAL_PASOS) + " de " + TOTAL_PASOS + " pasos" + (e.texto ? " · " + e.texto : "") : "";
    }
    return e;
  } catch (err) { return null; }
}

function mostrarFinal(html, name) {
  report = { html:html || "", name:name || "informe_aidm.html" };
  setSheet(false);
  $("doneTitle").textContent = prev.nombre_del_cliente ? "Propuesta de solución para " + prev.nombre_del_cliente : "Propuesta de solución";
  document.body.classList.add("done");
  if (report.html) $("report").srcdoc = report.html;
  else { $("report").srcdoc = "<p style='font-family:sans-serif;padding:24px'>No se ha encontrado el informe generado. Revisa la terminal.</p>"; $("download").disabled = true; $("abrir").disabled = true; }
}

async function mostrarInforme() {
  try {
    const r = await fetch("/api/informe"); if (!r.ok) return;
    const d = await r.json(); await refreshCaso(); mostrarFinal(d.report_html, d.filename);
  } catch (e) { /* sin informe recuperable: se queda el chat */ }
}

function resetPantalla() {
  messages = [{ role:"assistant", content:INTRO }]; prev = {};
  $("chat").replaceChildren(); showHero(); setSheet(false);
  document.body.classList.remove("done"); $("report").srcdoc = ""; $("download").disabled = false; $("abrir").disabled = false;
}

// Nueva sesión: único sitio que borra el caso en el servidor.
async function nuevaSesion() {
  try {
    const r = await fetch("/api/reset", { method:"POST" });
    if (!r.ok) { const d = await r.json().catch(() => ({})); addMsg("error", d.error || "No se pudo reiniciar la sesión (error " + r.status + ")."); return; }
  } catch (e) { addMsg("error", "No se pudo reiniciar la sesión: " + e.message); return; }
  resetPantalla(); await refreshEstado(true); await refreshCaso(); $("input").focus();
}

// Al abrir o recargar la página NO se borra nada: se recupera lo que haya en el servidor.
async function init() {
  resetPantalla();
  const e = await refreshEstado(true);
  await refreshCaso();
  if (e && e.ocupado) {
    setBusy(true);   // la ejecución sigue en el servidor: se espera a que acabe sin tocarla
    const w = setInterval(async () => {
      const s = await refreshEstado();
      if (s && !s.ocupado) { clearInterval(w); setBusy(false); await refreshCaso(); if (s.completado) await mostrarInforme(); }
    }, 2000);
  } else if (e && e.completado) { await mostrarInforme(); }
  $("input").focus();
}

function setBusy(on) {
  busy = on;
  $("send").disabled = on; $("input").disabled = on; $("reset").disabled = on;
  $("busy").classList.toggle("on", on); if (!on) $("busy").classList.remove("det"); progTxt = "";
  document.querySelector(".top .orb").classList.toggle("think", on);
  clearInterval(timer);
  if (on) {
    const t0 = Date.now();
    const tick = () => {
      const s = Math.round((Date.now() - t0) / 1000);
      $("stat").textContent = (progTxt || (s < 15 ? "Analizando tu respuesta" : "Sigue trabajando. Preparar la propuesta completa puede llevar unos minutos")) + " (" + s + " s)";
      if (s > 0 && s % 3 === 0) { refreshCaso(); refreshEstado(); }   // la ficha se rellena mientras el agente trabaja
    };
    tick(); timer = setInterval(tick, 1000);
  } else { $("stat").textContent = ""; }
}

async function send(text) {
  messages.push({ role:"user", content:text }); addMsg("user", text); setBusy(true); const t0 = Date.now();
  try {
    const r = await fetch("/api/chat", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ prompt:text, history:messages }) });
    const data = await r.json();
    if (!r.ok || data.error) throw new Error(data.error || data.detail || "Error " + r.status);
    if (data.completed) {
      await refreshCaso();
      mostrarFinal(data.report_html, data.filename);
    } else { messages.push({ role:"assistant", content:data.reply }); addMsg("assistant", data.reply, Math.round((Date.now() - t0) / 1000)); }
  } catch (e) {
    addMsg("error", "No se pudo ejecutar el agente. Revisa el modelo y las claves en .env. Detalle: " + e.message);
  } finally { setBusy(false); await refreshCaso(); $("input").focus(); }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || busy) return;
  $("input").value = ""; $("input").style.height = "auto"; send(text);
});
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
$("input").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; });
$("download").addEventListener("click", () => {
  const url = URL.createObjectURL(new Blob([report.html], { type:"text/html" }));
  Object.assign(document.createElement("a"), { href:url, download:report.name }).click();
  URL.revokeObjectURL(url);
});
$("abrir").addEventListener("click", () => {
  const url = URL.createObjectURL(new Blob([report.html], { type:"text/html" }));
  window.open(url, "_blank"); setTimeout(() => URL.revokeObjectURL(url), 60000);
});
$("reset").addEventListener("click", () => { if (!busy) nuevaSesion(); });
$("ficha").addEventListener("click", () => setSheet(!document.body.classList.contains("sheet")));
$("closeSheet").addEventListener("click", () => setSheet(false));
$("scrim").addEventListener("click", () => setSheet(false));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") setSheet(false); });
matchMedia("(min-width:901px)").addEventListener("change", (e) => { if (e.matches) setSheet(false); });
init();   // al abrir la página se recupera el estado del servidor; no se borra nada
</script>
</body>
</html>
