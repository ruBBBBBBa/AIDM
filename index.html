<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIDM - Discovery Agent</title>
<style>
  :root {
    --bg:#f5f6f8; --surface:#fff; --ink:#0f1b2d; --muted:#5b687a; --line:#dde2ea; --accent:#2a56e0; --accent-ink:#fff;
    --soft:#eaeffd; --ok:#17835c; --err:#b3322f; --flash:#fff4c2; --head:#0e1b2e; color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0a111b; --surface:#111b29; --ink:#e7edf6; --muted:#93a1b5; --line:#233145; --accent:#7391ff; --accent-ink:#0a1020;
      --soft:#1a2747; --ok:#4cc29a; --err:#ff9a98; --flash:#3a3414; --head:#070d16; color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font:15px/1.6 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:8px 14px; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }

  .top { background:var(--head); color:#fff; height:56px; padding:0 24px; display:flex; align-items:center; justify-content:space-between; flex:none; }
  .brand { display:flex; align-items:center; gap:12px; }
  .mark { width:28px; height:28px; border-radius:7px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:800; font-size:.9rem; }
  .brand b { font-size:1.05rem; letter-spacing:-.01em; }
  .brand i { width:1px; height:18px; background:rgba(255,255,255,.25); }
  .brand span { color:#b9c5d8; font-size:.92rem; }
  .top .right { display:flex; align-items:center; gap:12px; }
  .chip { font-size:.8rem; color:#c8d2e3; border:1px solid rgba(255,255,255,.25); border-radius:99px; padding:2px 10px; }
  .top button { background:transparent; color:#fff; border-color:rgba(255,255,255,.3); }
  .top button:hover:not(:disabled) { border-color:#fff; }

  .wrap { flex:1; min-height:0; width:100%; max-width:1240px; margin:0 auto; padding:20px 24px; display:flex; }
  .grid { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:20px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:10px; }
  .chat { display:flex; flex-direction:column; min-height:0; overflow:hidden; position:relative; }
  #chat { flex:1; overflow-y:auto; padding:28px 28px 12px; scroll-behavior:smooth; }
  .msg { max-width:680px; margin:0 auto 22px; }
  .msg .who { font-size:.82rem; font-weight:700; color:var(--accent); margin-bottom:2px; }
  .msg .txt { white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.user .who { color:var(--muted); }
  .msg.user .txt { background:var(--soft); border-radius:8px; padding:10px 14px; }
  .msg.error .who, .msg.error .txt { color:var(--err); }
  .msg.error .txt { border-left:3px solid var(--err); padding-left:12px; }
  .busy { height:3px; background:transparent; overflow:hidden; }
  .busy.on { background:var(--line); }
  .busy.on::after { content:""; display:block; width:30%; height:100%; background:var(--accent); animation:slide 1.3s ease-in-out infinite; }
  @keyframes slide { from { margin-left:-30%; } to { margin-left:100%; } }
  .stat { min-height:26px; padding:4px 28px 0; max-width:736px; width:100%; margin:0 auto; color:var(--muted); font-size:.85rem; font-variant-numeric:tabular-nums; }
  form { padding:6px 28px 18px; max-width:736px; width:100%; margin:0 auto; }
  .box { display:flex; align-items:flex-end; gap:10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); padding:8px 8px 8px 14px; }
  .box:focus-within { border-color:var(--accent); }
  textarea { flex:1; resize:none; max-height:140px; font:inherit; color:var(--ink); background:transparent; border:0; outline:0; padding:6px 0; }
  .hint { margin:6px 2px 0; font-size:.78rem; color:var(--muted); }

  .side { display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .sh { padding:16px 18px 12px; border-bottom:1px solid var(--line); }
  .sh div { display:flex; justify-content:space-between; align-items:baseline; font-weight:700; }
  .sh span { font-weight:600; color:var(--muted); font-size:.85rem; font-variant-numeric:tabular-nums; }
  .track { height:5px; border-radius:99px; background:var(--line); margin-top:10px; overflow:hidden; }
  .track i { display:block; height:100%; width:0; background:var(--ok); transition:width .4s; }
  #fields { flex:1; overflow-y:auto; padding:6px 18px 16px; }
  .g h3 { display:flex; justify-content:space-between; margin:16px 0 4px; font-size:.82rem; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; }
  .f { display:grid; grid-template-columns:10px 1fr; gap:0 10px; padding:7px 0; border-top:1px solid var(--line); }
  .dot { width:9px; height:9px; margin-top:7px; border-radius:50%; border:2px solid var(--line); }
  .f.on .dot { background:var(--ok); border-color:var(--ok); }
  .k { font-size:.78rem; color:var(--muted); }
  .v { font-size:.88rem; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .f.off .v { color:var(--muted); }
  .f.flash { animation:flash 1.6s; }
  @keyframes flash { from { background:var(--flash); } to { background:transparent; } }

  #done { display:none; flex:1; min-height:0; flex-direction:column; gap:14px; }
  body.done #done { display:flex; } body.done .grid { display:none; }
  .okbar { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:14px 20px; }
  .okbar h2 { margin:0; font-size:1.05rem; } .okbar p { margin:0; color:var(--muted); font-size:.88rem; }
  iframe { flex:1; width:100%; min-height:0; border:1px solid var(--line); border-radius:10px; background:#fff; }

  @media (max-width:900px) { .grid { grid-template-columns:1fr; } .side, .brand span, .brand i { display:none; } .wrap { padding:12px; } }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }

  .orb { position:relative; width:var(--s,28px); height:var(--s,28px); border-radius:50%; flex:none; background:conic-gradient(#2a56e0,#7a5cff,#14b8a6,#2a56e0); animation:spin 7s linear infinite; }
  .orb::after { content:""; position:absolute; inset:24%; border-radius:50%; background:var(--head); }
  .orb.think { animation-duration:1.3s; }
  .msg .orb::after, .hero .orb::after { background:var(--surface); }
  @keyframes spin { to { transform:rotate(360deg); } }
  .msg .who { display:flex; align-items:center; gap:7px; }
  .meta { display:flex; align-items:center; gap:10px; margin-top:4px; font-size:.76rem; color:var(--muted); }
  .meta button { padding:0 4px; border:0; background:none; font-size:.76rem; color:var(--accent); }
  .hero { max-width:560px; margin:5vh auto 0; text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .hero h1 { margin:10px 0 0; font-size:1.55rem; letter-spacing:-.02em; }
  .hero p { margin:0; color:var(--muted); }
  .chips { display:flex; flex-direction:column; gap:8px; width:100%; margin-top:12px; }
  .chips button { text-align:left; padding:10px 14px; }
  .led { display:inline-block; width:7px; height:7px; margin-right:7px; border-radius:50%; background:#8a97a8; }
  .led.ok { background:#37c28d; } .led.bad { background:#ff7b7b; }
  .ev { margin:4px 0; padding:5px 0 5px 12px; border-left:2px solid var(--line); font-size:.82rem; color:var(--muted); overflow-wrap:anywhere; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="orb" style="--s:26px"></div><b>AIDM</b><i></i><span>Discovery Agent para proyectos Data y AI</span></div>
  <div class="right"><span class="chip" id="conn"><i class="led"></i>Conectando</span><span class="chip">Primera PoC</span><button id="reset" type="button">Nueva sesión</button></div>
</header>

<div class="wrap">
  <main class="grid">
    <section class="card chat">
      <div id="chat" aria-live="polite"></div>
      <div class="busy" id="busy"></div>
      <div class="stat" id="stat"></div>
      <form id="form">
        <div class="box">
          <textarea id="input" rows="1" placeholder="Describe tu proyecto de Data y AI" aria-label="Mensaje"></textarea>
          <button id="send" class="primary" type="submit">Enviar</button>
        </div>
        <p class="hint">Intro para enviar. Mayús + Intro para un salto de línea.</p>
      </form>
    </section>
    <aside class="card side">
      <div class="sh"><div>Ficha del proyecto <span id="count">0/20</span></div><div class="track"><i id="barfill"></i></div></div>
      <div id="fields"></div>
    </aside>
  </main>

  <section id="done">
    <div class="card okbar">
      <div><h2 id="doneTitle">Propuesta de solución</h2><p>Discovery completado. Descarga el informe o revísalo aquí.</p></div>
      <button id="download" class="primary" type="button">Descargar informe (HTML)</button>
    </div>
    <iframe id="report" sandbox="allow-scripts" title="Informe de la propuesta"></iframe>
  </section>
</div>

<script>
const INTRO = "Describe la estructura y los requisitos de tu proyecto de Data y AI.";
const GROUPS = [
  ["Cliente", { nombre_del_cliente:"Cliente", "tamaño_empresa":"Tamaño de la empresa", sector:"Sector", tiene_equipo_datos:"Equipo de datos" }],
  ["Proyecto", { tipo_de_servicio:"Servicio solicitado", objetivo_del_proyecto:"Objetivo", enfoque_ai:"Enfoque de IA", kpis_de_exito:"KPIs de éxito", plazo_objetivo:"Plazo", restriccion_presupuestaria:"Presupuesto" }],
  ["Plataforma", { modelo_de_despliegue:"Despliegue", cloud_provider:"Proveedor cloud", tipo_de_arquitectura:"Arquitectura", herramienta_de_visualizacion:"Visualización", integration_scope:"Integración de datos", volumen_de_datos:"Volumen de datos" }],
  ["Situación actual", { madurez_analitica_actual:"Madurez analítica", tamano_equipo_tecnico:"Equipo técnico", stack_tecnologico_actual:"Stack actual", regulacion_y_compliance:"Compliance" }]
];
const $ = (id) => document.getElementById(id);
let messages, busy = false, timer = null, prev = {}, report = { html:"", name:"informe_aidm.html" };

const SUGGEST = [
  "Queremos predecir la demanda y optimizar las rutas de reparto de nuestra logística",
  "Tenemos los datos dispersos en varios sistemas y queremos unificarlos en la nube",
  "Queremos incorporar IA generativa para automatizar la atención al cliente"
];

function showHero() {
  const h = document.createElement("div"); h.id = "hero"; h.className = "hero";
  const o = document.createElement("div"); o.className = "orb"; o.style.setProperty("--s", "60px");
  const t = document.createElement("h1"); t.textContent = "Cuéntame tu proyecto de Data y AI";
  const p = document.createElement("p"); p.textContent = "Te haré las preguntas necesarias para entender el caso y preparar una propuesta de solución a medida.";
  const c = document.createElement("div"); c.className = "chips";
  SUGGEST.forEach((s) => { const b = document.createElement("button"); b.type = "button"; b.textContent = s; b.onclick = () => { $("input").value = s; $("input").focus(); }; c.appendChild(b); });
  h.append(o, t, p, c); $("chat").appendChild(h);
}

function addMsg(role, text, secs) {
  const hero = $("hero"); if (hero) hero.remove();
  const m = document.createElement("div"); m.className = "msg " + role;
  const w = document.createElement("div"); w.className = "who";
  if (role === "assistant") { const o = document.createElement("span"); o.className = "orb"; o.style.setProperty("--s", "16px"); w.appendChild(o); }
  w.append(role === "user" ? "Tú" : role === "error" ? "Error" : "AIDM");
  const t = document.createElement("div"); t.className = "txt";   // textContent: el texto del modelo nunca se interpreta como HTML
  m.append(w, t); $("chat").appendChild(m);
  const hora = new Date().toLocaleTimeString("es-ES", { hour:"2-digit", minute:"2-digit" });
  const fin = () => {
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = hora + (secs > 0 ? ", respondido en " + secs + " s" : "");
    if (role === "assistant") {
      const b = document.createElement("button"); b.type = "button"; b.textContent = "Copiar";
      b.onclick = () => { navigator.clipboard.writeText(text); b.textContent = "Copiado"; setTimeout(() => { b.textContent = "Copiar"; }, 1500); };
      meta.appendChild(b);
    }
    m.appendChild(meta); $("chat").scrollTop = $("chat").scrollHeight;
  };
  const directo = matchMedia("(prefers-reduced-motion: reduce)").matches || role !== "assistant" || text.length > 600;
  if (directo) { t.textContent = text; fin(); return; }
  let i = 0; const paso = Math.max(1, Math.ceil(text.length / 70));
  const id = setInterval(() => {
    i += paso; t.textContent = text.slice(0, i); $("chat").scrollTop = $("chat").scrollHeight;
    if (i >= text.length) { clearInterval(id); fin(); }
  }, 18);
}

function valueText(v) { return Array.isArray(v) ? v.join("; ") : String(v == null ? "" : v).trim(); }

function renderCaso(c) {
  const root = $("fields"); root.replaceChildren();
  let filled = 0, total = 0;
  GROUPS.forEach(([title, fields]) => {
    const g = document.createElement("div"); g.className = "g";
    const h = document.createElement("h3"); const hs = document.createElement("span"); hs.textContent = title; const hc = document.createElement("span");
    h.append(hs, hc); g.appendChild(h);
    let gf = 0;
    Object.entries(fields).forEach(([k, label]) => {
      const v = valueText((c[k] || {}).value); total++;
      if (v) { filled++; gf++; }
      const f = document.createElement("div"); f.className = "f " + (v ? "on" : "off");
      if (v && k in prev && prev[k] !== v) f.classList.add("flash");
      prev[k] = v;
      const dot = document.createElement("span"); dot.className = "dot";
      const box = document.createElement("div");
      const kk = document.createElement("div"); kk.className = "k"; kk.textContent = label;
      const vv = document.createElement("div"); vv.className = "v"; vv.textContent = v || "Pendiente"; vv.title = v;
      box.append(kk, vv); f.append(dot, box); g.appendChild(f);
    });
    hc.textContent = gf + "/" + Object.keys(fields).length;
    root.appendChild(g);
  });
  const ev = Array.isArray((c.evidencias || {}).value) ? c.evidencias.value : [];
  if (ev.length) {
    const g = document.createElement("div"); g.className = "g";
    const h = document.createElement("h3"); const a = document.createElement("span"); a.textContent = "Evidencias detectadas";
    const b = document.createElement("span"); b.textContent = String(ev.length); h.append(a, b); g.appendChild(h);
    ev.slice(-6).forEach((e) => { const p = document.createElement("div"); p.className = "ev"; p.textContent = e; g.appendChild(p); });
    root.appendChild(g);
  }
  $("count").textContent = filled + "/" + total;
  $("barfill").style.width = (100 * filled / total) + "%";
}

function setConn(ok) {
  const c = $("conn"); c.replaceChildren();
  const l = document.createElement("i"); l.className = "led " + (ok ? "ok" : "bad");
  c.append(l, ok ? "Agente listo" : "Sin conexión con el servidor");
}
async function refreshCaso() {
  try { const r = await fetch("/api/caso"); setConn(r.ok); if (r.ok) renderCaso(await r.json()); } catch (e) { setConn(false); }
}

async function startSession() {
  try { await fetch("/api/reset", { method:"POST" }); } catch (e) { /* si falla, solo se reinicia la pantalla */ }
  messages = [{ role:"assistant", content:INTRO }]; prev = {};
  $("chat").replaceChildren(); showHero();
  document.body.classList.remove("done"); $("report").srcdoc = ""; $("download").disabled = false;
  await refreshCaso(); $("input").focus();
}

function setBusy(on) {
  busy = on;
  $("send").disabled = on; $("input").disabled = on; $("reset").disabled = on;
  $("busy").classList.toggle("on", on); document.querySelector(".top .orb").classList.toggle("think", on);
  clearInterval(timer);
  if (on) {
    const t0 = Date.now();
    const tick = () => {
      const s = Math.round((Date.now() - t0) / 1000);
      $("stat").textContent = (s < 15 ? "Analizando tu respuesta" : "Sigue trabajando. Preparar la propuesta completa puede llevar unos minutos") + " (" + s + " s)";
      if (s > 0 && s % 3 === 0) refreshCaso();   // la ficha se rellena mientras el agente trabaja
    };
    tick(); timer = setInterval(tick, 1000);
  } else { $("stat").textContent = ""; }
}

async function send(text) {
  messages.push({ role:"user", content:text }); addMsg("user", text); setBusy(true); const t0 = Date.now();
  try {
    const r = await fetch("/api/chat", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ prompt:text, history:messages }) });
    const data = await r.json();
    if (!r.ok || data.error) throw new Error(data.error || data.detail || "Error " + r.status);
    if (data.completed) {
      report = { html:data.report_html || "", name:data.filename || "informe_aidm.html" };
      await refreshCaso();
      $("doneTitle").textContent = prev.nombre_del_cliente ? "Propuesta de solución para " + prev.nombre_del_cliente : "Propuesta de solución";
      document.body.classList.add("done");
      if (report.html) $("report").srcdoc = report.html;
      else { $("report").srcdoc = "<p style='font-family:sans-serif;padding:24px'>No se ha encontrado el informe generado. Revisa la terminal.</p>"; $("download").disabled = true; }
    } else { messages.push({ role:"assistant", content:data.reply }); addMsg("assistant", data.reply, Math.round((Date.now() - t0) / 1000)); }
  } catch (e) {
    addMsg("error", "No se pudo ejecutar el agente. Revisa el modelo y las claves en .env. Detalle: " + e.message);
  } finally { setBusy(false); await refreshCaso(); $("input").focus(); }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || busy) return;
  $("input").value = ""; $("input").style.height = "auto"; send(text);
});
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
$("input").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; });
$("download").addEventListener("click", () => {
  const url = URL.createObjectURL(new Blob([report.html], { type:"text/html" }));
  Object.assign(document.createElement("a"), { href:url, download:report.name }).click();
  URL.revokeObjectURL(url);
});
$("reset").addEventListener("click", () => { if (!busy) startSession(); });
startSession();   // al abrir la página siempre empieza una sesión limpia
</script>
</body>
</html>
