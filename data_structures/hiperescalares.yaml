        fecha: 2026-11-16
      - servicio: Amazon Forecast
        buscar: [amazon forecast]
        estado: cerrado a clientes nuevos desde el 29 jul 2024
        sustituto: la previsión de series temporales de Amazon SageMaker Canvas (o la API de AutoML de SageMaker)
        fuente: https://aws.amazon.com/blogs/machine-learning/transition-your-amazon-forecast-usage-to-amazon-sagemaker-canvas/
        fecha: 2026-11-16
      - servicio: AWS IoT Analytics
        buscar: [aws iot analytics]
        estado: retirado el 15 dic 2025
        sustituto: Amazon Kinesis Data Streams y Amazon S3, con Glue y Athena para analizar
        fuente: https://docs.aws.amazon.com/iotanalytics/latest/userguide/iotanalytics-end-of-support.html
        fecha: 2026-11-16
      - servicio: AWS IoT Events
        buscar: [aws iot events]
        estado: retirado el 20 may 2026
        sustituto: reglas de AWS IoT Core con AWS Lambda o Amazon EventBridge para las alarmas (propuesta de AIDM; la página oficial no se pudo leer)
        fuente: https://aws.amazon.com/about-aws/whats-new/2025/05/aws-service-changes
        fecha: 2026-11-16
      - servicio: Amazon Timestream for LiveAnalytics
        buscar: [timestream for liveanalytics, timestream for live analytics]
