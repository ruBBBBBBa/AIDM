# Gateway de modelos: qué modelo usa cada tarea de AIDM (lo lee gateway.py).
#
# - Cada tarea tiene un perfil, según el trabajo que hace. Cada perfil es una lista de modelos en orden: se usa el
#   primero y, si falla o se queda sin cupo, el siguiente (sus reservas), mejor de otro proveedor.
# - Un modelo se escribe con su nombre de LiteLLM, «proveedor/modelo»: groq/, gemini/, mistral/, sambanova/,
#   nvidia_nim/ o cloudflare/. En el .env solo van las claves de cada proveedor.
# - Para probar otro modelo en una tarea sin tocar este archivo: MODELO_<TAREA> en el .env, en mayúsculas
#   (MODELO_COSTES=gemini/gemini-3.6-flash). Va primero, y las reservas del perfil siguen detrás.
# - El log dice qué modelo usa cada tarea y lo que gasta cada llamada, en las líneas que empiezan por «[gateway]».
# - Los cambios valen desde la siguiente ejecución, sin reiniciar Streamlit.
# - Primera elección (2 nov 2026), sin medir todavía: se comparan con pruebas_modelos/comparar.py, y
#   «comparar.py --comprobar» dice si algún nombre no existe con tus claves.

perfiles:
  extraccion:       # JSON fiel a lo que dice el usuario, rápido y muchas veces (discovery)
    - mistral/ministral-14b-2512
    - gemini/gemini-3.5-flash-lite
    - groq/openai/gpt-oss-20b
  calculo:          # cantidades y cuentas en JSON (costes, equipo)
    - gemini/gemini-3.8-flash
    - sambanova/gpt-oss-120b
    - cloudflare/@cf/openai/gpt-oss-120b
  redaccion:        # texto largo y bien escrito, en el idioma del cliente (estructura, propuesta, perfiles)
    - mistral/mistral-large-4
    - gemini/gemini-3.6-flash
    - sambanova/DeepSeek-V3.1
  tecnico:          # texto técnico largo, con mucha salida (las 7 fases del roadmap)
    - gemini/gemini-3.8-flash
    - mistral/mistral-large-4
    - cloudflare/@cf/openai/gpt-oss-120b
  contexto_largo:   # leer mucho y resumirlo (el resumen de la propuesta)
    - gemini/gemini-3.5-flash-lite
    - mistral/mistral-small-latest
  codigo:           # Terraform (solo con Infracost)
    - mistral/codestral-latest
    - cloudflare/@cf/qwen/qwen2.5-coder-32b-instruct
  decision:         # el modelo decisorio (Jev/Laya); aún no lo usa ninguna tarea
    - mistral/ministral-8b-latest
    - groq/openai/gpt-oss-20b

por_defecto: redaccion   # el perfil de una tarea que no esté en la lista de abajo
timeout_por_defecto: 300  # segundos como máximo por intento; si tarda más, se reintenta o pasa a la reserva

tareas:
  discovery: extraccion
  estructura: redaccion
  # Propuesta (proposal_crew.py)
  arquitectura: redaccion
  gobernanza: redaccion
  estrategia: redaccion
  visualizacion: redaccion
  # Costes (estimation_crew.py)
  costes: calculo
  perfiles: redaccion
  equipo: calculo
  terraform: codigo
  # Roadmap (roadmap_builder.py)
  resumen: contexto_largo
  roadmap_fuentes: tecnico
  roadmap_ingesta: tecnico
  roadmap_almacenamiento: tecnico
  roadmap_etl: tecnico
  roadmap_modelado: tecnico
  roadmap_ml: tecnico
  roadmap_bi: tecnico

# Reglas de cada modelo, en todos los perfiles: el tope de salida (max_tokens), los reintentos antes de pasar a
# la reserva (num_retries; 2 si no se dice) y el tope de tiempo (timeout, en segundos; si no se dice, el de arriba).
# Límites del plan gratuito, a 2 nov 2026.
modelos:
  groq/openai/gpt-oss-20b: {max_tokens: 4096, num_retries: 0}    # 8.000 TPM: si no cabe, a la reserva sin reintentar
  groq/openai/gpt-oss-120b: {max_tokens: 4096, num_retries: 0}   # 8.000 TPM
  sambanova/gpt-oss-120b: {num_retries: 0}                       # 20 peticiones al día
  sambanova/DeepSeek-V3.1: {num_retries: 0}                      # 20 peticiones al día
  cloudflare/@cf/openai/gpt-oss-120b: {max_tokens: 6000}         # 10.000 neuronas al día, para todos sus modelos
  cloudflare/@cf/qwen/qwen2.5-coder-32b-instruct: {max_tokens: 4096}